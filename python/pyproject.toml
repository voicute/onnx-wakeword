[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-wakeword"
version = "0.1.0"
description = "Offline wake-word / keyword-spotting engine on ONNX Runtime — no cloud, ~130 KB models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Voicute" }]
keywords = ["wake-word", "keyword-spotting", "kws", "onnx", "voice", "speech", "offline", "voice-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "onnxruntime",
]

[project.optional-dependencies]
# pyaudio powers WakeWordEngine.start() (callback microphone streaming)
audio = ["pyaudio"]
# sounddevice powers the standalone mic_test.py / infer.py scripts
sounddevice = ["sounddevice"]
dev = ["pytest", "ruff", "build", "twine"]

[project.scripts]
onnx-wakeword-demo = "onnx_wakeword.cli:main"

[project.urls]
Homepage = "https://github.com/voicute/onnx-wakeword"
Repository = "https://github.com/voicute/onnx-wakeword"
Issues = "https://github.com/voicute/onnx-wakeword/issues"
Documentation = "https://github.com/voicute/onnx-wakeword/tree/main/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onnx_wakeword = ["resources/*.onnx", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
