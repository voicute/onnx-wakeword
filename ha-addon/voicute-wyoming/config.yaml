name: "Voicute Wake Word"
version: "1.1.2"
slug: "voicute-wyoming"
description: "Custom wake word detection powered by Voicute — supports Chinese, English, and 150+ languages with sub-130KB models"
url: "https://github.com/voicute/onnx-wakeword"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
host_network: true
# /share is the only HA folder reachable from other add-ons (Samba, File
# editor). Mounted read-only so users can supply custom models there
# without SSH-ing into the add-on's private /data volume.
map:
  - share:ro
options:
  model_info: "/app/models/model_info.json"
  mel: "/app/models/melspectrogram.onnx"
  threshold: 0.4
  cooldown: 1500
  L1: true
  L3: true
  L5: false
  debug: false
schema:
  model_info: str
  mel: str
  threshold: float
  cooldown: int
  L1: bool
  L3: bool
  L5: bool
  debug: bool
homeassistant: "2024.1.0"
